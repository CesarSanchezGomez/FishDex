# ==========================================================================
#  FishDex — commands.
#  Each top-level key is a command (the key = internal id, don't change it).
#  You can edit 'name' and 'aliases', set 'enabled: false' to disable it, and
#  change the permissions. Editing this file requires RESTARTING the server.
# ==========================================================================

config-version: 1

# Opens the FishDex (or a menu: /fishdex <menu>). 'reload' and 'version' are
# admin subcommands, each with its own permission ('reload' and 'version'
# cannot be used as menu ids).
fishdex:
  enabled: true
  name: fishdex
  aliases: []
  permission: fishdex.command.open
  subcommands:
    reload:  { permission: fishdex.command.reload }
    version: { permission: fishdex.command.version }

