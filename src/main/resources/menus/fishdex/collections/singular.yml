# Singular collection. Self-contained menu; edit freely.
category: singular_fishes
title: '{colors}<b>Singular</b>{/colors} <white><page>/<page-count></white>'
colors:
- '#FF7373'
- '#FF0D0D'
rows: 6
content-slots: 18-35
open-sound: minecraft:entity.fishing_bobber.splash
