# Epic collection. Self-contained menu; edit freely.
category: epic_fishes
title: '{colors}<b>Epic</b>{/colors} <white><page>/<page-count></white>'
colors:
- '#98BE85'
- '#4D8E2D'
rows: 6
content-slots: 18-35
