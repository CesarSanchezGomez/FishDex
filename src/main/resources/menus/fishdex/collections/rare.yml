# Rare collection. Self-contained menu; edit freely.
category: rare_fishes
title: '{colors}<b>Rare</b>{/colors} <white><page>/<page-count></white>'
colors:
- '#FEF0B1'
- '#FDE211'
rows: 6
content-slots: 18-35
open-sound: minecraft:entity.fishing_bobber.splash
filler:
  enabled: false
