# Project coordinates
group=com.cesarcosmico
version=0.1.0-SNAPSHOT

# Build target: Java 25 bytecode (Minecraft 26.2 requires Java 25+ at runtime).
# Compiles with any JDK >= 25 via --release.
java_release=25

# --- Dependency versions (adjust to match the running server) ---
# Paper API uses the year.drop.build scheme; pin to your server's build.
paper_api_version=26.2.build.123-stable
# CustomFishing (the fishing engine). Latest published on repo.momirealms.net.
custom_fishing_version=2.3.24

# Optional integrations
placeholderapi_version=2.12.3

# Runtime libraries (downloaded at load time by Paper's library loader, not shaded).
# HikariCP is also compiled against; sqlite-jdbc is used by tests. The runtime coordinates
# live inline in FishDexLoader (Paper's documented pattern) — keep HikariCP in sync.
hikaricp_version=7.0.2
sqlite_version=3.53.0.0

# Gradle
org.gradle.caching=true
org.gradle.parallel=true
